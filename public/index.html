<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>拼豆图纸</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239a5fc4'/%3E%3Ccircle cx='10' cy='10' r='4' fill='white'/%3E%3Ccircle cx='22' cy='10' r='4' fill='white'/%3E%3Ccircle cx='10' cy='22' r='4' fill='white'/%3E%3Ccircle cx='22' cy='22' r='4' fill='white' opacity='.55'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="btn ghost small" href="/">‹ 入口</a>
  <h1>拼豆图纸</h1>
  <button id="b-export" class="btn primary small" type="button">导出 PNG</button>
</header>

<main class="layout">
  <!-- 配置 -->
  <aside class="panel">
    <details open id="ai">
      <summary>AI 绘图</summary>
      <label>想要什么 / 想怎么改
        <textarea id="ai-text" rows="3" maxlength="500" placeholder="例如：一只戴红围巾的橘猫，可爱简洁；或：把背景改成蓝色"></textarea>
      </label>
      <label>质量档位
        <select id="ai-preset"><option value="">速度优先</option></select>
      </label>
      <div class="ai-actions">
        <button id="ai-gen" class="btn primary small" type="button">AI 生成图片</button>
        <button id="ai-edit" class="btn ghost small" type="button">修改当前图片</button>
      </div>
      <p id="ai-status" class="hint"></p>
      <div id="ai-more" hidden>
        <label>提示词（可修改后重画）
          <textarea id="ai-prompt" rows="4" maxlength="1500"></textarea>
        </label>
        <p id="ai-reply" class="hint"></p>
        <div class="ai-actions">
          <button id="ai-redo" class="btn ghost small" type="button">用此提示词重画</button>
          <button id="ai-undo" class="btn ghost small" type="button" hidden>回到上一张</button>
        </div>
      </div>
      <p class="hint">由火山方舟的 Seedream 出图，画的是普通插画；转成豆子格由本应用固定的取色流程完成，不让模型画像素。你的描述和需要修改的当前图片会发送给火山引擎。</p>
    </details>

    <details open>
      <summary>参考图片（可选）</summary>
      <div id="drop" class="drop">
        <input id="file" type="file" accept="image/*" hidden>
        <button id="b-pick" class="btn ghost small" type="button">选择图片</button>
        <button id="b-clear-img" class="btn ghost small" type="button" hidden>移除图片</button>
        <p class="hint" id="img-info">也可以拖放到这里。不选图片则从空白画布开始手动绘制。普通处理只在本机浏览器里进行；仅使用上面的 AI 修改时才会上传。</p>
      </div>
      <label>图片适配方式
        <select id="c-fit">
          <option value="cover">裁剪铺满</option>
          <option value="contain">完整显示（留空）</option>
          <option value="stretch">拉伸</option>
        </select>
      </label>
    </details>

    <details open>
      <summary>图纸尺寸（豆数）</summary>
      <div class="pair">
        <label>宽 <input id="c-width" type="number" min="5" max="100" inputmode="numeric"></label>
        <label>高 <input id="c-height" type="number" min="5" max="100" inputmode="numeric"></label>
      </div>
      <label class="check"><input id="c-lock" type="checkbox"><span>有图片时锁定宽高比</span></label>
    </details>

    <details open>
      <summary>颜色</summary>
      <label>色板 <select id="c-palette"></select></label>
      <label>最多使用颜色数 <output id="o-maxColors"></output>
        <input id="c-maxColors" type="range" min="0" max="48" step="1">
      </label>
      <label class="check"><input id="c-dither" type="checkbox"><span>抖动（渐变更平滑，但更碎）</span></label>
      <label class="check"><input id="c-blank" type="checkbox"><span>透明区域不放豆</span></label>
    </details>

    <details>
      <summary>画面调整</summary>
      <label>亮度 <output id="o-brightness"></output><input id="c-brightness" type="range" min="-100" max="100" step="5"></label>
      <label>对比度 <output id="o-contrast"></output><input id="c-contrast" type="range" min="-100" max="100" step="5"></label>
      <label>饱和度 <output id="o-saturation"></output><input id="c-saturation" type="range" min="-100" max="100" step="5"></label>
      <button id="b-reset-adj" class="btn ghost small" type="button">重置</button>
    </details>

    <details>
      <summary>显示</summary>
      <label>豆子样式
        <select id="c-style"><option value="circle">圆形</option><option value="square">方形</option></select>
      </label>
      <label>缩放 <output id="o-zoom"></output><input id="c-zoom" type="range" min="8" max="44" step="2"></label>
      <label class="check"><input id="c-showGrid" type="checkbox"><span>显示网格</span></label>
      <label class="check"><input id="c-showCodes" type="checkbox"><span>显示色号（缩放够大时）</span></label>
      <label>加粗线间隔
        <select id="c-emph"><option value="0">无</option><option value="5">每 5 格</option><option value="10">每 10 格</option></select>
      </label>
      <label>拼板分割线（每 N 格，0=不画）<input id="c-board" type="number" min="0" max="100" inputmode="numeric"></label>
    </details>
  </aside>

  <!-- 图纸 -->
  <section class="stage">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="工具">
        <button id="t-view" type="button" class="on" title="点击格子高亮同色">查看</button>
        <button id="t-pen" type="button" title="选一个颜色后点击/拖动绘制">画笔</button>
        <button id="t-erase" type="button" title="清除格子">橡皮</button>
      </div>
      <button id="b-regen" class="btn ghost small" type="button" hidden>按当前配置重新生成</button>
      <span id="info" class="hint"></span>
    </div>
    <p id="stale" class="note" hidden>已手动修改图纸。改动配置不会自动应用，点“按当前配置重新生成”会丢弃手动修改。</p>
    <div id="swatches" class="swatches" hidden></div>
    <div class="canvas-wrap"><canvas id="cv"></canvas></div>
    <h2>用量清单 <span id="total" class="hint"></span></h2>
    <ul id="stats" class="stats"></ul>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script src="palettes.js"></script>
<script src="quantize.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
